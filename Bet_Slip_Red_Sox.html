<!DOCTYPE svg PUBLIC “-//W3C//DTD SVG 1.1//EN” “http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd”>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BET SLIP</title>
    <link rel="stylesheet" href="main_bet.css">
</head>

<body>
<div class="main-bet-container">
    <div class="main">
        <div><a href="MLB_Sports_Betting.html" class="exit-button">X</a></div>
        <div class="main-line">
            <div class="clear">Clear Bet Slip</div>
            <div class="account">Account: $500</div>
        </div>
        </div>
        <div class="betting-options">
            <div class="bet-slip-options green">
                Bet Slip
            </div>
            <div class="bet-slip-options">
                Open Bets
            </div>
            <div class="bet-slip-options">
                Settled
            </div>
            </div>
        <div>
        <div class="home-team-header">
            <h1>Boston Red Sox</h1>
        </div>

        <div class="wager-section">
            <div class="wager-section-names">
                <div>Straight Bet</div>
                <div>Moneyline</div>
                <div>Enter Wager</div>
            </div>
            <div class="wager-section-data">
                <br>
                <div>-130</div>
                <div class="wager">$<input placeholder='0.00' id="display" readonly></div>
            </div>
        </div>
        <div class="total-payout-section">
            <div class="payout">Total Payout</div>
            <div class="payout topPayout">$<input placeholder='0.00' id="totalDisplay" readonly></div>
        </div>
         <div class="calculator-container">
                <div class="keys">
                    <button id="one">1</button>
                    <button id="two">2</button>
                    <button id="three">3</button>
                    <button id="four">4</button>
                    <button id="five">5</button>
                    <button id="six">6</button>
                    <button id="seven">7</button>
                    <button id="eight">8</button>
                    <button id="nine">9</button>
                    <button id="zero">0</button>
                    <button id="period">.</button>
                    <button id="backspace"><img src="img/backspace.png"></button>
                </div>
                <button class="submit-btn" id="calculate">OK</button>
            </div>

            <div class="footer-totals">
                <div class="total-cost">
                    <div>Total Cost:</div>
                    <div>$<input placeholder='0.00' id="totalCostDisplay" readonly></div>
                </div>

                <div class="total-payout">
                    <div>Total Payout:</div>
                    <div class="bottomPayout">$<input placeholder='0.00' id="totalDisplay" readonly></div>
                </div>
            </div>
    </div>

    </div>

    </div>
</div>
 <script src="script.js"></script>
</body>
</html>
